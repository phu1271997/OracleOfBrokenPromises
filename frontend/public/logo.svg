<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.5" cy="0.45" r="0.35">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Crystal ball outer ring -->
  <circle cx="256" cy="220" r="120" fill="none" stroke="url(#mark)" stroke-width="14"/>
  <!-- Inner glow -->
  <circle cx="256" cy="220" r="110" fill="url(#orb)"/>
  <!-- Eye inside the ball -->
  <ellipse cx="256" cy="220" rx="70" ry="36" fill="none" stroke="url(#mark)" stroke-width="8"/>
  <circle cx="256" cy="220" r="16" fill="url(#mark)"/>
  <!-- Highlight arc -->
  <path d="M190 170 Q210 140 250 145" stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Stand -->
  <path d="M200 340 Q220 360 256 365 Q292 360 312 340" stroke="url(#mark)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="186" y1="370" x2="326" y2="370" stroke="url(#mark)" stroke-width="10" stroke-linecap="round"/>
  <!-- Broken chain links -->
  <ellipse cx="170" cy="400" rx="18" ry="12" fill="none" stroke="url(#mark)" stroke-width="6" transform="rotate(-20 170 400)" opacity="0.7"/>
  <ellipse cx="200" cy="410" rx="18" ry="12" fill="none" stroke="url(#mark)" stroke-width="6" transform="rotate(10 200 410)" opacity="0.5"/>
  <ellipse cx="312" cy="410" rx="18" ry="12" fill="none" stroke="url(#mark)" stroke-width="6" transform="rotate(-10 312 410)" opacity="0.5"/>
  <ellipse cx="342" cy="400" rx="18" ry="12" fill="none" stroke="url(#mark)" stroke-width="6" transform="rotate(20 342 400)" opacity="0.7"/>
</svg>
